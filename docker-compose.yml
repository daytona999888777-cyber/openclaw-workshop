#This file is to standardise every student's openclaw to 2026.4.24 for workshop purposes.


services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.4.24
    init: true
    ports:
      - "${PORT}:${PORT}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_PROJECT_NAME}.${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=${PORT}"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./data:/home/node/.openclaw
      - ./data/workspace:/home/node/.openclaw/workspace
